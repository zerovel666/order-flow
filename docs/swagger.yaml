basePath: /
definitions:
  dto.CreateProductRequestDTO:
    properties:
      available_quantity:
        type: integer
      currency:
        $ref: '#/definitions/dto.Currency'
      name:
        type: string
      price:
        type: integer
      sku:
        type: string
    required:
    - currency
    - name
    - sku
    type: object
  dto.CreateProductResponseDTO:
    properties:
      created_at:
        type: string
      currency:
        $ref: '#/definitions/dto.Currency'
      id:
        type: integer
      inventory:
        $ref: '#/definitions/dto.Inventory'
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: integer
      sku:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreateUserRequestDTO:
    properties:
      login:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        $ref: '#/definitions/dto.Role'
    required:
    - login
    - name
    - password
    - role
    type: object
  dto.Currency:
    enum:
    - KZT
    type: string
    x-enum-varnames:
    - KZTCurrency
  dto.Inventory:
    properties:
      available_quantity:
        type: integer
      id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.LoginRequestDTO:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  dto.Product:
    properties:
      created_at:
        type: string
      currency:
        $ref: '#/definitions/dto.Currency'
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: integer
      sku:
        type: string
      updated_at:
        type: string
    type: object
  dto.Role:
    enum:
    - CLIENT
    - SELLER
    - ADMIN
    type: string
    x-enum-varnames:
    - ClientRole
    - SellerRole
    - AdminRole
  response.Message:
    properties:
      lang:
        type: string
      message:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: string
      data: {}
      errors: {}
      messages:
        items:
          $ref: '#/definitions/response.Message'
        type: array
      status:
        type: boolean
    type: object
info:
  contact: {}
  title: OrderFlow API
  version: "1.0"
paths:
  /health-check:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Проверка состояния сервиса
      tags:
      - health
  /product:
    get:
      description: Возвращает все товары, включая неактивные, в порядке ID. Доступно
        авторизованным пользователям. Ошибки сервиса возвращаются с HTTP 200 и status=false.
      produces:
      - application/json
      responses:
        "200":
          description: Список товаров; при ошибке status=false
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.Product'
                  type: array
              type: object
        "401":
          description: Необходима авторизация
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Список товаров
      tags:
      - Product
    post:
      consumes:
      - application/json
      description: Создаёт товар и его остаток. Доступно продавцу (SELLER) и администратору
        (ADMIN). Ошибки сервиса возвращаются с HTTP 200 и status=false.
      parameters:
      - description: Данные товара и начальный остаток
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Товар с вложенным inventory; при ошибке status=false
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CreateProductResponseDTO'
              type: object
        "400":
          description: Некорректное тело запроса или отсутствуют обязательные поля
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Необходима авторизация
          schema:
            $ref: '#/definitions/response.Response'
        "422":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Создание товара
      tags:
      - Product
  /product/{id}:
    delete:
      description: Устанавливает is_active=false без удаления товара. Доступно SELLER
        и ADMIN. Ошибки сервиса, включая отсутствие товара, возвращаются с HTTP 200
        и status=false.
      parameters:
      - description: ID товара
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Результат деактивации; при ошибке status=false
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: ID должен быть положительным целым числом
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Необходима авторизация
          schema:
            $ref: '#/definitions/response.Response'
        "422":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Деактивация товара
      tags:
      - Product
  /user/info:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Информация пользователя по токену
      tags:
      - User
  /user/login:
    post:
      parameters:
      - description: Данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Авторизация пользователя
      tags:
      - User
  /user/register:
    post:
      parameters:
      - description: Данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Регистрация пользователя
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: 'Введите: Bearer <токен>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
