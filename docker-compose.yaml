services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-app
    init: true
    working_dir: /app
    volumes:
      - .:/app
      - app_tmp:/app/tmp
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8000/health-check"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 5
    ports:
      - "8000:8000"
    environment:
      APP_PORT: "8000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: order-flow
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: go-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order-flow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order-flow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  app_tmp:
  go_modules:
  go_build:

